  provider: hf
  checkpoint: ${oc.env:CHECKPOINT_PATH,${oc.env:SCRATCH,/scratch}/hf_models/LLaDA-8B-Base}
  encoder: ${oc.env:SCRATCH,/scratch}/hf_models/LLaDA-8B-Base
  tokenizer: ${oc.env:TOKENIZER_PATH,${oc.env:SCRATCH,/scratch}/hf_models/LLaDA-8B-Base}
  model_config: null
  mdlm_embed_attr: null
  batch_size: 1
  device: cuda
