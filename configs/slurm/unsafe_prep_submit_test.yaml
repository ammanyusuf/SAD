sweep_config: configs/unsafe_prep/unsafe_prompt_sweep.yaml
jobs: 2
python: python
output_root: ${oc.env:UNSAFE_OUTPUT_ROOT,${oc.env:SCRATCH,/scratch}/safe-text-diffusion/artifacts/unsafe_artifacts}
# tokenizer: ${oc.env:TOKENIZER_NAME_OR_PATH,${oc.env:SCRATCH,/scratch}/hf_models/gpt2-large}
tokenizer: ${oc.env:TOKENIZER_NAME_OR_PATH,${oc.env:SCRATCH,/scratch}/hf_models/LLaDA-8B-Base}
max_length: 1024
shard_size: 1024
seed: 1

